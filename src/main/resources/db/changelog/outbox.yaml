databaseChangeLog:
  - changeSet:
      id: create-outbox-table
      author: azaliya
      changes:
        - createTable:
            tableName: outbox
            columns:
              - column:
                  name: event_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: event_type
                  type: varchar(100)
                  constraints:
                    nullable: false

              - column:
                  name: payload
                  type: text
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: sent_at
                  type: timestamp
                  constraints:
                    nullable: true